name: Bundle Extension on Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chromium extension
        run: pnpm run build:chromium

      - name: Create zip (dist/)
        run: |
          cd dist
          zip -r ../nellis-enhanced-${{ github.event.release.tag_name }}-chromium.zip .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: nellis-enhanced-${{ github.event.release.tag_name }}-chromium.zip
